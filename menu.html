<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foodies Hub</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        header {
            background-color: #ff4d4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff4d4d;
        }

        .hero {
            background-color: #ffe6e6;
            padding: 50px;
            text-align: center;
        }

        .hero h1 {
            color: #333;
        }

        .menu {
            padding: 40px;
            text-align: center;
        }

        .menu h2 {
            color: #ff4d4d;
        }

        .food-items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .food-card {
            background: white;
            width: 220px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .food-card img {
            width: 100%;
            border-radius: 10px;
        }

        .food-card h3 {
            margin: 10px 0 5px;
        }

        .food-card p {
            color: #555;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>🍕 Foodies Hub</h1>
    <p>Delicious Food, Happy Mood</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    <h1>Welcome to Foodies Hub</h1>
    <p>Fresh, tasty and healthy food for you</p>
</div>

<section class="menu">
    <h2>Our Menu</h2>
    <div class="food-items">

        <div class="food-card">
            <img src="https://via.placeholder.com/200" alt="Burger">
            <h3>Cheese Burger</h3>
            <p>Price: ৳250</p>
        </div>

        <div class="food-card">
            <img src="https://via.placeholder.com/200" alt="Pizza">
            <h3>Pizza</h3>
            <p>Price: ৳600</p>
        </div>

        <div class="food-card">
            <img src="https://via.placeholder.com/200" alt="Pasta">
            <h3>Pasta</h3>
            <p>Price: ৳350</p>
        </div>

    </div>
</section>

<footer>
    <p>© 2026 Foodies Hub | All Rights Reserved</p>
</footer>

</body>
</html>
